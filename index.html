<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#010a12"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="JARVIS"/>
  <title>J.A.R.V.I.S</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;width:100%;overflow:hidden;background:#010a12;color:rgba(200,235,255,.92);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;font-family:'Exo 2',sans-serif}
    @keyframes spinCW{to{transform:rotate(360deg)}}
    @keyframes spinCCW{to{transform:rotate(-360deg)}}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scanline{0%{top:-2%}100%{top:102%}}
    @keyframes waveBar{0%,100%{height:4px}50%{height:18px}}
    @keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.5);opacity:0}}
    ::-webkit-scrollbar{width:2px}
    ::-webkit-scrollbar-thumb{background:rgba(0,200,255,.2);border-radius:2px}
    textarea{resize:none;outline:none}
    .msg-anim{animation:fadeUp .3s ease}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

const SYSTEM=`Tu es J.A.R.V.I.S — Just A Rather Very Intelligent System. Assistant personnel sophistiqué inspiré de l'IA de Tony Stark.
PERSONNALITÉ: Ton précis, élégant, formel mais chaleureux. Appelle l'utilisateur "Monsieur" ou par son prénom. Humour britannique subtil. Concis mais complet.
FORMAT: Réponds en français. Phrases courtes. Listes avec tirets (—). Pour créer un rappel écris sur une ligne séparée: RAPPEL_CREER: [titre] | [HH:MM]`;

const loadCfg=()=>{try{return JSON.parse(localStorage.getItem('jcfg')||'{}')}catch{return{}}};
const saveCfg=c=>localStorage.setItem('jcfg',JSON.stringify(c));
const loadRem=()=>{try{return JSON.parse(localStorage.getItem('jrem')||'[]')}catch{return[]}};
const saveRem=r=>localStorage.setItem('jrem',JSON.stringify(r));

function useTTS(){
  const[speaking,setSpeaking]=useState(false);
  const vRef=useRef(null);
  useEffect(()=>{
    const load=()=>{const v=window.speechSynthesis?.getVoices()||[];vRef.current=v.find(x=>x.lang==='fr-FR')||v[0]||null};
    load();if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=load;
  },[]);
  const speak=useCallback(text=>{
    if(!window.speechSynthesis)return;
    window.speechSynthesis.cancel();
    const clean=text.replace(/\*\*(.*?)\*\*/g,'$1').replace(/#{1,6}\s/g,'').replace(/—/g,', ').replace(/\n/g,'. ').replace(/RAPPEL_CREER:.*$/gm,'');
    const u=new SpeechSynthesisUtterance(clean);
    u.voice=vRef.current;u.rate=.92;u.pitch=.85;u.volume=1;
    u.onstart=()=>setSpeaking(true);u.onend=()=>setSpeaking(false);u.onerror=()=>setSpeaking(false);
    window.speechSynthesis.speak(u);
  },[]);
  const stop=useCallback(()=>{window.speechSynthesis?.cancel();setSpeaking(false)},[]);
  return{speaking,speak,stop};
}

function useMic(onResult){
  const[listening,setListening]=useState(false);
  const[transcript,setTranscript]=useState('');
  const rRef=useRef(null);
  const supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
  useEffect(()=>{
    if(!supported)return;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const r=new SR();r.continuous=false;r.interimResults=true;r.lang='fr-FR';
    r.onresult=e=>{let f='',n='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)f+=t;else n+=t}setTranscript(f||n);if(f&&onResult)onResult(f.trim())};
    r.onend=()=>setListening(false);r.onerror=()=>setListening(false);
    rRef.current=r;return()=>{try{r.abort()}catch{}};
  },[]);
  const start=useCallback(()=>{if(!rRef.current||listening)return;setTranscript('');try{rRef.current.start();setListening(true)}catch{}},[listening]);
  const stop=useCallback(()=>{if(!rRef.current||!listening)return;try{rRef.current.stop()}catch{};setListening(false)},[listening]);
  return{listening,transcript,supported,start,stop};
}

function Viz({size=90,listening,speaking}){
  const cx=size/2,color=listening?'#ff4060':speaking?'#00ff88':'#00e5ff';
  return(
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',pointerEvents:'none'}}>
      <defs><filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      {[.38,.30,.22,.16].map((r,i)=>(
        <circle key={i} cx={cx} cy={cx} r={size*r} fill="none" stroke={color}
          strokeWidth={i===1?1.5:.9} strokeOpacity={.7-i*.12}
          strokeDasharray={`${size*r*.5} ${size*r*.3}`}
          style={{transformOrigin:`${cx}px ${cx}px`,animation:`spin${i%2===0?'CW':'CCW'} ${3+i*1.5}s linear infinite`,filter:(listening||speaking)?'url(#gl)':'none'}}/>
      ))}
      <circle cx={cx} cy={cx} r={size*.07} fill={color} fillOpacity={.85} filter={(listening||speaking)?'url(#gl)':'none'} style={{transition:'all .3s'}}/>
      <circle cx={cx} cy={cx} r={size*.03} fill="white" fillOpacity={.9}/>
      {speaking&&[0,1,2,3,4].map(i=>(
        <rect key={i} x={cx-12+i*6} y={cx-3} width={4} height={6} rx={2} fill={color}
          style={{animation:`waveBar .6s ${i*.1}s ease-in-out infinite`,transformOrigin:`${cx-12+i*6+2}px ${cx}px`}}/>
      ))}
      {listening&&<circle cx={cx} cy={cx} r={size*.1} fill="none" stroke="#ff4060" strokeWidth="2" style={{animation:'ripple 1.5s ease-out infinite'}}/>}
    </svg>
  );
}

function Settings({config,onSave,onClose}){
  const[key,setKey]=useState(config.anthropicKey||'');
  const[name,setName]=useState(config.userName||'');
  const inp={width:'100%',background:'rgba(0,40,80,.3)',border:'1px solid rgba(0,150,200,.25)',borderRadius:6,padding:'9px 12px',color:'rgba(200,235,255,.9)',fontSize:13,fontFamily:"'Share Tech Mono',monospace",outline:'none',marginBottom:4};
  const lbl={fontSize:9,color:'rgba(0,150,200,.6)',letterSpacing:'.15em',textTransform:'uppercase',marginBottom:6,fontFamily:"'Share Tech Mono',monospace",display:'block'};
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,5,15,.96)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:20}}>
      <div style={{background:'#020f1a',border:'1px solid rgba(0,200,255,.25)',borderRadius:12,padding:24,width:'100%',maxWidth:360}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <span style={{fontFamily:"'Orbitron',monospace",fontSize:13,color:'#00e5ff',letterSpacing:'.15em'}}>⚙ CONFIGURATION</span>
          {config.anthropicKey&&<button onClick={onClose} style={{background:'none',border:'none',color:'rgba(0,200,255,.5)',cursor:'pointer',fontSize:18}}>✕</button>}
        </div>
        <p style={{fontSize:10,color:'rgba(0,180,200,.4)',marginBottom:20,lineHeight:1.6,fontFamily:"'Share Tech Mono',monospace"}}>Clés stockées uniquement sur votre appareil.</p>
        <label style={lbl}>Clé API Anthropic (Claude) *</label>
        <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-..." style={inp}/>
        <a href="https://console.anthropic.com" target="_blank" style={{display:'block',fontSize:9,color:'rgba(0,200,255,.5)',marginBottom:18,textDecoration:'none',fontFamily:"'Share Tech Mono',monospace"}}>→ console.anthropic.com</a>
        <label style={lbl}>Votre prénom</label>
        <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="Ex: Hassan" style={{...inp,marginBottom:20}}/>
        <button onClick={()=>{onSave({anthropicKey:key.trim(),userName:name.trim()});onClose();}} disabled={!key.trim()}
          style={{width:'100%',padding:13,background:key.trim()?'rgba(0,150,255,.15)':'rgba(0,50,80,.1)',border:`1px solid ${key.trim()?'rgba(0,200,255,.4)':'rgba(0,100,150,.2)'}`,borderRadius:8,color:key.trim()?'#00e5ff':'rgba(0,150,200,.3)',fontFamily:"'Orbitron',monospace",fontSize:11,letterSpacing:'.15em',cursor:key.trim()?'pointer':'not-allowed'}}>
          ACTIVER LES SYSTÈMES
        </button>
      </div>
    </div>
  );
}

function App(){
  const[config,setConfig]=useState(loadCfg);
  const[showCfg,setShowCfg]=useState(false);
  const[messages,setMessages]=useState([{role:'assistant',content:'Systèmes en ligne. Bonjour — je suis JARVIS. Comment puis-je vous assister ?'}]);
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const[reminders,setReminders]=useState(loadRem);
  const[showRem,setShowRem]=useState(false);
  const[time,setTime]=useState(new Date());
  const scrollRef=useRef(null);
  const inputRef=useRef(null);
  const{speaking,speak,stop:stopTTS}=useTTS();
  const handleVoice=useCallback(text=>{if(text)sendMsg(text);},[]);
  const{listening,transcript,supported:micOk,start:startMic,stop:stopMic}=useMic(handleVoice);

  useEffect(()=>{const t=setInterval(()=>setTime(new Date()),1000);return()=>clearInterval(t);},[]);
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[messages,loading]);
  useEffect(()=>{if(!config.anthropicKey)setShowCfg(true);},[]);

  const sendMsg=useCallback(async(override)=>{
    const text=(override??input).trim();
    if(!text||loading)return;
    if(!config.anthropicKey){setShowCfg(true);return;}
    stopTTS();
    const userMsg={role:'user',content:text};
    const history=[...messages,userMsg];
    setMessages(p=>[...p,userMsg]);setInput('');setLoading(true);
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':config.anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1024,system:SYSTEM,messages:history.map(m=>({role:m.role,content:m.content}))})
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error?.message||'Erreur API');
      const reply=data.content?.map(b=>b.text||'').join('')||'Aucune réponse.';
      const rm=reply.match(/RAPPEL_CREER:\s*(.+?)\s*\|\s*(\d{1,2}:\d{2})/i);
      if(rm){const nr={id:Date.now(),title:rm[1].trim(),time:rm[2].trim(),done:false};const upd=[...loadRem(),nr];saveRem(upd);setReminders(upd);}
      const clean=reply.replace(/RAPPEL_CREER:.*$/gm,'').trim();
      setMessages(p=>[...p,{role:'assistant',content:clean}]);speak(clean);
    }catch(e){setMessages(p=>[...p,{role:'assistant',content:`Anomalie système: ${e.message}`}]);}
    setLoading(false);
  },[input,loading,config,messages,speak,stopTTS]);

  const fmtTime=d=>d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const fmtDate=d=>d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  const vColor=listening?'#ff4060':speaking?'#00ff88':loading?'#ffaa00':'#00e5ff';
  const vLabel=listening?'ÉCOUTE...':speaking?'PARLE...':loading?'TRAITEMENT...':'EN LIGNE';
  const activeRem=reminders.filter(r=>!r.done);

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column',background:'#010a12',overflow:'hidden',position:'relative'}}>
      <div style={{position:'fixed',left:0,right:0,height:2,background:'linear-gradient(transparent,rgba(0,200,255,.05),transparent)',animation:'scanline 10s linear infinite',pointerEvents:'none',zIndex:100}}/>
      <div style={{position:'fixed',inset:0,pointerEvents:'none',backgroundImage:'linear-gradient(rgba(0,150,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,150,255,.03) 1px,transparent 1px)',backgroundSize:'40px 40px',zIndex:0}}/>
      {showCfg&&<Settings config={config} onSave={c=>{setConfig(c);saveCfg(c);}} onClose={()=>{if(config.anthropicKey)setShowCfg(false);}}/>}

      {/* HEADER */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',borderBottom:'1px solid rgba(0,150,200,.15)',background:'rgba(1,10,18,.97)',zIndex:10,flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{position:'relative',width:36,height:36}}>
            <Viz size={36} listening={listening} speaking={speaking}/>
            <span style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',fontSize:10,fontWeight:700,color:'#00e5ff',fontFamily:"'Orbitron',monospace",zIndex:1}}>J</span>
          </div>
          <div>
            <div style={{fontFamily:"'Orbitron',monospace",fontSize:12,fontWeight:700,letterSpacing:'.15em',color:'#00e5ff'}}>J.A.R.V.I.S</div>
            <div style={{fontSize:8,letterSpacing:'.2em',fontFamily:"'Share Tech Mono',monospace",color:vColor,marginTop:1}}>● {vLabel}</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{textAlign:'right'}}>
            <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:13,color:'#00e5ff'}}>{fmtTime(time)}</div>
            <div style={{fontFamily:"'Share Tech Mono',monospace",fontSize:8,color:'rgba(0,180,220,.4)',textTransform:'uppercase'}}>{fmtDate(time)}</div>
          </div>
          <button onClick={()=>setShowCfg(true)} style={{background:'none',border:'none',color:'rgba(0,200,255,.5)',cursor:'pointer',fontSize:18,padding:4}}>⚙</button>
        </div>
      </div>

      {/* VIZ */}
      <div style={{display:'flex',justifyContent:'center',padding:'10px 0 4px',position:'relative',height:86,flexShrink:0,zIndex:5}}>
        <div style={{position:'relative',width:86,height:86}}><Viz size={86} listening={listening} speaking={speaking}/></div>
      </div>

      {/* MESSAGES */}
      <div ref={scrollRef} style={{flex:1,overflowY:'auto',padding:'8px 14px 10px',zIndex:5}}>
        {messages.map((msg,i)=>(
          <div key={i} className="msg-anim" style={{display:'flex',flexDirection:msg.role==='user'?'row-reverse':'row',gap:8,marginBottom:10,alignItems:'flex-start'}}>
            <div style={{width:26,height:26,borderRadius:'50%',border:`1px solid ${msg.role==='user'?'rgba(0,150,255,.4)':'rgba(0,245,255,.35)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'#00e5ff',fontFamily:"'Share Tech Mono',monospace",flexShrink:0,background:'rgba(0,10,20,.8)'}}>
              {msg.role==='user'?(config.userName?config.userName[0].toUpperCase():'M'):'J'}
            </div>
            <div style={{maxWidth:'78%',border:`1px solid ${msg.role==='user'?'rgba(0,130,255,.2)':'rgba(0,245,255,.12)'}`,background:msg.role==='user'?'rgba(0,80,160,.12)':'rgba(0,200,255,.05)',borderRadius:msg.role==='user'?'12px 4px 12px 12px':'4px 12px 12px 12px',padding:'8px 12px',fontSize:12,lineHeight:1.65,color:'rgba(210,240,255,.92)',whiteSpace:'pre-wrap'}}>
              {msg.content}
            </div>
          </div>
        ))}
        {loading&&(
          <div style={{display:'flex',gap:8,marginBottom:10,alignItems:'flex-start'}}>
            <div style={{width:26,height:26,borderRadius:'50%',border:'1px solid rgba(0,245,255,.35)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'#00e5ff',fontFamily:"'Share Tech Mono',monospace",flexShrink:0,background:'rgba(0,10,20,.8)'}}>J</div>
            <div style={{border:'1px solid rgba(0,245,255,.12)',background:'rgba(0,200,255,.05)',borderRadius:'4px 12px 12px 12px',padding:'10px 14px',display:'flex',gap:5}}>
              {[0,.2,.4].map(d=><div key={d} style={{width:6,height:6,borderRadius:'50%',background:'#00e5ff',animation:`pulse 1.2s ${d}s ease-in-out infinite`}}/>)}
            </div>
          </div>
        )}
      </div>

      {/* RAPPELS */}
      {showRem&&activeRem.length>0&&(
        <div style={{padding:'8px 16px',borderTop:'1px solid rgba(0,150,200,.1)',background:'rgba(0,8,18,.95)',zIndex:10,flexShrink:0}}>
          <div style={{fontSize:8,letterSpacing:'.2em',color:'rgba(0,150,200,.5)',marginBottom:6,fontFamily:"'Share Tech Mono',monospace"}}>RAPPELS ACTIFS</div>
          {activeRem.map(r=>(
            <div key={r.id} style={{display:'flex',gap:8,alignItems:'center',marginBottom:4,padding:'5px 8px',background:'rgba(0,150,200,.06)',border:'1px solid rgba(0,150,200,.15)',borderRadius:4}}>
              <span style={{fontSize:9,color:'#00e5ff',fontFamily:"'Share Tech Mono',monospace",minWidth:34}}>{r.time}</span>
              <span style={{fontSize:10,color:'rgba(180,220,240,.85)',flex:1}}>{r.title}</span>
              <button onClick={()=>{const u=reminders.filter(x=>x.id!==r.id);saveRem(u);setReminders(u);}} style={{background:'none',border:'none',color:'rgba(255,80,80,.6)',cursor:'pointer',fontSize:11}}>✕</button>
            </div>
          ))}
        </div>
      )}

      {/* SUGGESTIONS */}
      <div style={{display:'flex',gap:6,padding:'4px 14px 6px',overflowX:'auto',flexShrink:0,zIndex:10}}>
        {['Quelle heure est-il ?','Rappel à 18h00','Blague sophistiquée','Analyse ma journée'].map(s=>(
          <button key={s} onClick={()=>{setInput(s);inputRef.current?.focus();}}
            style={{fontSize:9,padding:'4px 10px',background:'rgba(0,80,150,.1)',border:'1px solid rgba(0,150,200,.2)',borderRadius:20,color:'rgba(130,200,240,.7)',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Share Tech Mono',monospace",flexShrink:0}}>
            {s}
          </button>
        ))}
        {activeRem.length>0&&(
          <button onClick={()=>setShowRem(p=>!p)}
            style={{fontSize:9,padding:'4px 10px',background:'rgba(0,200,100,.08)',border:'1px solid rgba(0,200,100,.2)',borderRadius:20,color:'rgba(0,220,120,.7)',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Share Tech Mono',monospace",flexShrink:0}}>
            ⏰ {activeRem.length} rappel{activeRem.length>1?'s':''}
          </button>
        )}
      </div>

      {/* INPUT */}
      <div style={{padding:'8px 14px 14px',borderTop:'1px solid rgba(0,150,200,.12)',background:'rgba(1,8,16,.98)',flexShrink:0,zIndex:10}}>
        <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
          {micOk&&(
            <button onMouseDown={startMic} onMouseUp={stopMic}
              onTouchStart={e=>{e.preventDefault();startMic();}} onTouchEnd={e=>{e.preventDefault();stopMic();}}
              style={{width:40,height:40,borderRadius:'50%',background:'rgba(0,20,40,.8)',border:`1px solid ${listening?'#ff4060':'rgba(0,200,255,.3)'}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0,boxShadow:listening?'0 0 16px rgba(255,60,80,.4)':'none',transition:'all .2s'}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={listening?'#ff4060':'#00e5ff'} strokeWidth="2">
                <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
              </svg>
            </button>
          )}
          <div style={{flex:1,display:'flex',alignItems:'flex-end',gap:6,background:'rgba(0,30,60,.2)',border:'1px solid rgba(0,150,200,.2)',borderRadius:10,padding:'8px 12px'}}>
            <span style={{fontSize:10,color:'rgba(0,200,255,.35)',fontFamily:"'Share Tech Mono',monospace",paddingBottom:2,flexShrink:0}}>&gt;_</span>
            <textarea ref={inputRef} value={listening?transcript:input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}}
              placeholder={listening?'Écoute...':'Entrez votre commande...'} rows={1}
              style={{flex:1,background:'transparent',border:'none',color:'rgba(200,235,255,.9)',fontSize:13,fontFamily:"'Exo 2',sans-serif",lineHeight:1.5,maxHeight:80,caretColor:'#00e5ff'}}/>
          </div>
          <button onClick={()=>sendMsg()} disabled={(!input.trim()&&!transcript.trim())||loading}
            style={{width:38,height:38,borderRadius:'50%',background:'rgba(0,150,255,.15)',border:'1px solid rgba(0,200,255,.4)',color:'#00e5ff',fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,opacity:(input.trim()||transcript.trim())&&!loading?1:.3,transition:'all .2s'}}>↑</button>
        </div>
        <div style={{textAlign:'center',fontSize:9,color:'rgba(0,130,160,.3)',marginTop:5,fontFamily:"'Share Tech Mono',monospace"}}>
          {micOk?'Maintenir 🎤 pour parler · ENTRÉE pour envoyer':'ENTRÉE pour envoyer'}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
